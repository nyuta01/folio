name: release-python

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to package (skip release publish if not pushed yet)"
        required: false

# Default to read-only at the workflow level; jobs that need to write
# (release assets, OIDC token) opt in explicitly below.
permissions:
  contents: read

jobs:
  build-and-release:
    name: Build wheel + sdist and attach to GitHub Release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write    # softprops/action-gh-release@v2 attaches release assets
    outputs:
      wheel: ${{ steps.artifacts.outputs.wheel }}
      sdist: ${{ steps.artifacts.outputs.sdist }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c890a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3.2.4
        with:
          enable-cache: true

      - name: Sync dev dependencies (build backend lives in pyproject)
        run: uv sync --frozen

      - name: Build sdist + wheel
        run: make dist

      - name: Smoke-test the wheel in a fresh venv
        run: make dist-check

      - name: Compute artifact metadata
        id: artifacts
        run: |
          set -euo pipefail
          wheel="$(ls dist/folio_kit-*.whl)"
          sdist="$(ls dist/folio_kit-*.tar.gz)"
          {
            echo "wheel=${wheel}"
            echo "sdist=${sdist}"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 folio_kit-*.whl folio_kit-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update GitHub Release with assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.1
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.wheel }}
            ${{ steps.artifacts.outputs.sdist }}
            dist/SHA256SUMS.txt

      - name: Upload artifacts to workflow run (always)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: folio-python-${{ github.ref_name }}
          path: |
            dist/folio_kit-*.whl
            dist/folio_kit-*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # ── PyPI publish (OIDC trusted publishing) ────────────────────────
  #
  # Configured at https://pypi.org/manage/account/publishing/ with:
  #   project=folio-kit, owner=nyuta01, repo=folio,
  #   workflow=release-python.yml, environment=pypi.
  #
  # Triggered automatically when a GitHub Release draft is published.
  # Workflow: tag push → draft Release created → human edits + publishes
  # → this job fires and uploads the attached wheel/sdist to PyPI.
  publish-pypi:
    name: Publish to PyPI (OIDC)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/folio-kit
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheel + sdist from GitHub Release
        run: |
          mkdir dist
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "folio_kit-*.whl" \
            --pattern "folio_kit-*.tar.gz" \
            --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to PyPI (trusted publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
