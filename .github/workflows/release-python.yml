name: release-python

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to package (skip release publish if not pushed yet)"
        required: false
      publish-pypi:
        description: "Also publish to PyPI (requires OIDC trusted publisher)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write    # softprops/action-gh-release@v2 needs this for release assets
  id-token: write    # PyPI OIDC trusted publishing needs an OIDC token (used by publish-pypi job)

jobs:
  build-and-release:
    name: Build wheel + sdist and attach to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      wheel: ${{ steps.artifacts.outputs.wheel }}
      sdist: ${{ steps.artifacts.outputs.sdist }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dev dependencies (build backend lives in pyproject)
        run: uv sync --frozen

      - name: Build sdist + wheel
        run: make dist

      - name: Smoke-test the wheel in a fresh venv
        run: make dist-check

      - name: Compute artifact metadata
        id: artifacts
        run: |
          set -euo pipefail
          wheel="$(ls dist/folio-*.whl)"
          sdist="$(ls dist/folio-*.tar.gz)"
          {
            echo "wheel=${wheel}"
            echo "sdist=${sdist}"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 folio-*.whl folio-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update GitHub Release with assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.wheel }}
            ${{ steps.artifacts.outputs.sdist }}
            dist/SHA256SUMS.txt

      - name: Upload artifacts to workflow run (always)
        uses: actions/upload-artifact@v4
        with:
          name: folio-python-${{ github.ref_name }}
          path: |
            dist/folio-*.whl
            dist/folio-*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # ── PyPI publish (OIDC trusted publishing) ────────────────────────
  #
  # Configured at https://pypi.org/manage/account/publishing/ with:
  #   project=folio, owner=nyuta01, repo=folio,
  #   workflow=release-python.yml, environment=pypi.
  #
  # The job is gated by the explicit `publish-pypi` dispatch input —
  # tag pushes do not auto-publish to avoid surprises. The
  # `environment: pypi` declaration below must match the trusted
  # publisher registration on PyPI; both must agree or OIDC fails.
  publish-pypi:
    name: Publish to PyPI (OIDC)
    needs: build-and-release
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish-pypi == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/folio
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts from build job
        uses: actions/download-artifact@v4
        with:
          name: folio-python-${{ github.ref_name }}
          path: dist
      - name: Drop SHA256SUMS.txt before upload
        run: rm -f dist/SHA256SUMS.txt
      - name: Publish to PyPI (trusted publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
