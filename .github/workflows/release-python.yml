name: release-python

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to package (skip release publish if not pushed yet)"
        required: false

# Default to read-only at the workflow level; jobs that need to write
# (release assets, OIDC token) opt in explicitly below.
permissions:
  contents: read

jobs:
  build-and-release:
    name: Build wheel + sdist from release ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write    # softprops/action-gh-release@v2 attaches release assets
    outputs:
      wheel: ${{ steps.artifacts.outputs.wheel }}
      sdist: ${{ steps.artifacts.outputs.sdist }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Sync dev dependencies (build backend lives in pyproject)
        run: uv sync --frozen

      - name: Build sdist + wheel
        run: make dist

      - name: Smoke-test the wheel in a fresh venv
        run: make dist-check

      - name: Compute artifact metadata
        id: artifacts
        run: |
          set -euo pipefail
          wheel="$(ls dist/folio_kit-*.whl)"
          sdist="$(ls dist/folio_kit-*.tar.gz)"
          {
            echo "wheel=${wheel}"
            echo "sdist=${sdist}"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 folio_kit-*.whl folio_kit-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update GitHub Release with assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.1
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.wheel }}
            ${{ steps.artifacts.outputs.sdist }}
            dist/SHA256SUMS.txt

      - name: Upload artifacts to workflow run (always)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: folio-python-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
          path: |
            dist/folio_kit-*.whl
            dist/folio_kit-*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # ── PyPI publish (OIDC trusted publishing) ────────────────────────
  #
  # Configured at https://pypi.org/manage/account/publishing/ with:
  #   project=folio-kit, owner=nyuta01, repo=folio,
  #   workflow=release-python.yml, environment=pypi.
  #
  # Triggered automatically when a GitHub Release draft is published.
  # Workflow: tag push → draft Release created → human edits + publishes
  # → this workflow rebuilds and smoke-tests the package from the release tag
  # → this job uploads only artifacts produced by this workflow run.
  publish-pypi:
    name: Publish to PyPI (OIDC)
    if: github.event_name == 'release'
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/folio-kit
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheel + sdist from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: folio-python-${{ github.event.release.tag_name }}
          path: dist

      - name: Keep only Python distribution files
        run: |
          find dist -type f ! \( -name 'folio_kit-*.whl' -o -name 'folio_kit-*.tar.gz' \) -delete
          find dist -maxdepth 1 -type f -print

      - name: Publish to PyPI (trusted publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
