name: release-desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to package (skip release upload if not pushed yet)"
        required: false

permissions:
  contents: write    # softprops/action-gh-release@v2 needs this to attach assets

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runs-on: macos-14
            build-cmd: dist:mac
            artifact-glob: |
              apps/desktop/out/*.dmg
              apps/desktop/out/*.zip
          - platform: linux
            arch: x64
            runs-on: ubuntu-24.04
            build-cmd: dist:linux
            artifact-glob: |
              apps/desktop/out/*.AppImage
              apps/desktop/out/*.deb
          - platform: windows
            arch: x64
            runs-on: windows-latest
            build-cmd: dist:win
            artifact-glob: |
              apps/desktop/out/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            viewer/package-lock.json
            apps/desktop/package-lock.json

      - name: Build the renderer (viewer/dist/)
        working-directory: viewer
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      # ── Build (unsigned for v0.1.0) ──────────────────────────────────
      #
      # Code signing is gated behind a follow-up workflow that wires in the
      # APPLE_ID / CSC_LINK / WIN_CSC_LINK secrets. For now we always build
      # unsigned; users see a Gatekeeper / SmartScreen warning on first
      # launch.
      - name: Build the desktop app (unsigned)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ""
        run: npm run ${{ matrix.build-cmd }} -- --publish=never

      - name: Compute SHA-256 checksums
        shell: bash
        working-directory: apps/desktop/out
        run: |
          set -euo pipefail
          # Strip nested directories that electron-builder leaves behind
          # (mac-arm64/, etc.) so only the distributable installers remain.
          shopt -s nullglob
          mkdir -p _release
          for f in *.dmg *.zip *.AppImage *.deb *.exe; do
            [[ -f "$f" ]] && cp "$f" _release/
          done
          cd _release
          if [[ -n "$(ls 2>/dev/null)" ]]; then
            shasum -a 256 * > SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt
            cat SHA256SUMS-*.txt
          fi

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: folio-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/out/_release/
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: |
            apps/desktop/out/_release/*
