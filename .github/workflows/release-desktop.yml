name: release-desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to package (skip release upload if not pushed yet)"
        required: false

# Default to read-only at the workflow level; the build job opts in to
# contents: write only when running on a tag push (uploading release assets).
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: write    # softprops/action-gh-release@v2 attaches release assets

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runs-on: macos-14
            build-cmd: dist:mac
            artifact-glob: |
              apps/desktop/out/*.dmg
              apps/desktop/out/*.zip
          - platform: linux
            arch: x64
            runs-on: ubuntu-24.04
            build-cmd: dist:linux
            artifact-glob: |
              apps/desktop/out/*.AppImage
              apps/desktop/out/*.deb
          - platform: windows
            arch: x64
            runs-on: windows-latest
            build-cmd: dist:win
            artifact-glob: |
              apps/desktop/out/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            viewer/package-lock.json
            apps/desktop/package-lock.json

      - name: Build the renderer (viewer/dist/)
        working-directory: viewer
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      # ── Build (unsigned for v0.1.0) ──────────────────────────────────
      #
      # Code signing is gated behind a follow-up workflow that wires in the
      # APPLE_ID / CSC_LINK / WIN_CSC_LINK secrets. For now we always build
      # unsigned; users see a Gatekeeper / SmartScreen warning on first
      # launch.
      - name: Build the desktop app (unsigned)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ""
        run: npm run ${{ matrix.build-cmd }} -- --publish=never

      - name: Compute SHA-256 checksums
        shell: bash
        working-directory: apps/desktop/out
        run: |
          set -euo pipefail
          # Strip nested directories that electron-builder leaves behind
          # (mac-arm64/, etc.) so only the distributable installers remain.
          shopt -s nullglob
          mkdir -p _release
          for f in *.dmg *.zip *.AppImage *.deb *.exe; do
            [[ -f "$f" ]] && cp "$f" _release/
          done
          cd _release
          # Use Node for SHA-256 — shasum/sha256sum availability differs
          # between Git Bash on Windows and macOS / Linux runners.
          for f in *; do
            [[ -f "$f" && "$f" != SHA256SUMS-* ]] || continue
            hash="$(node -e "const fs=require('node:fs');const c=require('node:crypto');console.log(c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" "$f")"
            echo "${hash}  ${f}"
          done > SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt
          cat SHA256SUMS-*.txt

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: folio-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/out/_release/
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.1
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: |
            apps/desktop/out/_release/*
