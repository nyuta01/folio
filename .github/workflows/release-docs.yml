name: release-docs

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - ".github/workflows/release-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro / Starlight site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install dependencies
        working-directory: apps/docs
        run: npm ci

      - name: Build site
        working-directory: apps/docs
        env:
          SITE: https://nyuta01.github.io
          BASE: /folio
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/docs/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    # Only attempt the deploy when the repo opts in via the
    # `PAGES_ENABLED` repository variable. Private repos on the Free
    # plan can't host Pages; setting `PAGES_ENABLED=true` once Pages is
    # enabled (Settings → Pages → Source: GitHub Actions) flips this on.
    if: vars.PAGES_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
