name: release-docs

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - ".github/workflows/release-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro / Starlight site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install dependencies
        working-directory: apps/docs
        run: npm ci

      - name: Build site
        working-directory: apps/docs
        env:
          SITE: https://nyuta01.github.io
          BASE: /folio
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    # Only attempt the deploy when the repo opts in via the
    # `PAGES_ENABLED` repository variable. Private repos on the Free
    # plan can't host Pages; setting `PAGES_ENABLED=true` once Pages is
    # enabled (Settings → Pages → Source: GitHub Actions) flips this on.
    if: vars.PAGES_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
