<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- V2-03 F monogram: geometric, two strokes, the top stroke "folds" at right -->
  <rect width="28" height="28" rx="5" fill="#c45c2c"/>
  <!-- vertical stem -->
  <rect x="7" y="6" width="3.5" height="16" rx="0.5" fill="#faf9f5"/>
  <!-- top bar that folds down at the right end -->
  <path d="M7 6 L20 6 L20 9 L10.5 9 Z" fill="#faf9f5"/>
  <path d="M20 6 L23 9 L20 9 Z" fill="#fbeee5"/>
  <!-- middle bar (shorter, with diagonal fold tip) -->
  <rect x="7" y="13" width="9" height="3" rx="0.5" fill="#faf9f5"/>
  <path d="M16 13 L18 14.5 L16 16 Z" fill="#fbeee5"/>
</svg>
