<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- V2-04 Leaf: folio = Latin "leaf". Single asymmetric leaf with geometric central vein. -->
  <rect width="28" height="28" rx="5" fill="#faf9f5"/>
  <!-- leaf body: asymmetric pointed oval -->
  <path d="M14 3 C 20 8 22 14 14 25 C 6 14 8 8 14 3 Z" fill="#c45c2c"/>
  <!-- folded right half (darker) -->
  <path d="M14 3 C 20 8 22 14 14 25 L 14 3 Z" fill="#a04e23"/>
  <!-- central vein -->
  <path d="M14 4 L14 24" stroke="#faf9f5" stroke-width="0.8" stroke-linecap="round"/>
</svg>
