[project]
name = "folio"
version = "0.1.2"
description = "Portable, AI-native data sheets."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Folio contributors" }]
keywords = ["data-contract", "odcs", "ai-agent", "duckdb", "jsonl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "anthropic>=0.40",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "fastmcp>=2.6",
    "filelock>=3.13",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rfc8785>=0.1.4",
    "typer>=0.12",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
folio = "folio.cli:main"
folio-mcp = "folio_mcp.cli:main"
folio-viewer = "folio_viewer.cli:main"

[project.urls]
Homepage = "https://github.com/nyuta01/folio"
Documentation = "https://github.com/nyuta01/folio/blob/main/docs/design-docs/overview.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folio", "src/folio_mcp", "src/folio_viewer"]

[tool.hatch.build.targets.sdist]
# Hatch defaults to "everything in the repo" for the sdist, which sweeps in
# `apps/desktop/out/`, `apps/desktop/node_modules/`, `viewer/dist/`, etc. —
# blowing the tarball past 500 MB. Restrict to the Python project surface.
include = [
  "src/",
  "tests/",
  "examples/",
  "pyproject.toml",
  "README.md",
  "SPECIFICATION.md",
  "uv.lock",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
