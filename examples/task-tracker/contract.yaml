apiVersion: v3.0.0
kind: DataContract
id: example-task-tracker
name: task-tracker
version: 1.0.0
description: |
  An engineering-task tracker modelled on Folio's own internal
  `docs/exec-plans/feature-list.json`. Each row is one well-scoped
  unit of work that an AI coding agent (Claude Code / Cursor / Codex)
  can pick up, plan, execute, verify, and close. Humans triage,
  prioritise, and review.

  The sheet is meant to be the *system of record* for backlog work -
  checked into git so the audit trail travels with the code, queried
  via `folio query` for sorting and slicing, and reviewed via
  `folio serve` when the team wants the visual grid.

  Cross-record dependency tracking is the demo's load-bearing feature:
  `is_blocked` runs a DuckDB `sql` derivation against the whole sheet
  to decide whether a task's `depends` list is fully closed.

schema:
  - name: items
    physicalType: jsonl
    properties:
      # ---- identity --------------------------------------------------------
      - name: id
        logicalType: string
        primaryKey: true
        required: true
        description: Stable task id, convention - "<EPIC>-NNN" (e.g. APIV2-007).

      - name: title
        logicalType: string
        required: true
        description: One-line summary read by the agent during pick-next.
        # `x-editable-by` is what the Viewer uses to decide which cells
        # show inline-edit affordances. The SDK / CLI permit any actor
        # whose pattern is listed; the Viewer hides the edit UI for
        # cells without a matching pattern. Open here so the example
        # works out of the box for both agent and human actors.
        x-editable-by: ["agent:*", "human:*"]

      - name: epic
        logicalType: string
        required: true
        description: |
          Coarse grouping (e.g. "api-v2", "billing-redesign"). Used for
          stand-up rollups and per-epic progress queries.
        x-editable-by: ["agent:*", "human:*"]

      # ---- workflow state -------------------------------------------------
      - name: status
        logicalType: string
        required: true
        description: |
          The workflow state. `pending` rows wait in the backlog;
          `planning` rows are getting a plan written; `in_progress`
          rows are actively being executed; `blocked` rows are stuck
          on an external dependency; `in_review` rows have a PR open;
          `done` and `cancelled` are terminal.
        enum: [pending, planning, in_progress, blocked, in_review, done, cancelled]
        x-editable-by: ["agent:*", "human:*"]

      - name: priority
        logicalType: string
        required: true
        description: P0 (drop-everything) ... P3 (someday).
        enum: [P0, P1, P2, P3]
        x-editable-by: ["agent:*", "human:*"]

      - name: owner
        logicalType: string
        required: true
        description: |
          Who is expected to do the work. `agent` - an AI coding agent
          drives the task. `human` - a named contributor. `shared` -
          agent drafts, human reviews and lands.
        enum: [agent, human, shared]
        x-editable-by: ["agent:*", "human:*"]

      - name: assignee
        logicalType: string
        description: |
          Free-text actor string. For agent-owned tasks use the
          actor that will appear in provenance (e.g. "agent:execute").
        x-editable-by: ["agent:*", "human:*"]

      # ---- structural metadata --------------------------------------------
      - name: depends
        logicalType: array
        description: |
          Array of other task ids that must reach `status=done` before
          this row can leave `pending`. Drives the `is_blocked` derivation.
        x-editable-by: ["agent:*", "human:*"]

      - name: plan_url
        logicalType: string
        description: |
          Path (in this repo) or URL pointing to the per-task plan
          markdown. Written by the `plan-task` skill before execution.
        x-editable-by: ["agent:*", "human:*"]

      - name: paths
        logicalType: array
        description: |
          Files the task will touch (or has touched). Drives the
          `path_count` derivation and tells the human reviewer where
          to look during code review.
        x-editable-by: ["agent:*", "human:*"]

      - name: verification
        logicalType: array
        description: |
          Verification gates that have *passed* for this task
          (e.g. ["pytest", "drift-check", "viewer-smoke"]). The
          `verification_count` derivation surfaces the length so
          standups can flag work that landed without sufficient
          gating.
        x-editable-by: ["agent:*", "human:*"]

      - name: notes
        logicalType: string
        description: Free-form context, links, decisions.
        x-editable-by: ["agent:*", "human:*"]

      - name: effort_estimate_hours
        logicalType: number
        description: |
          Rough estimate set by the human or the planning agent. Used
          for capacity planning, not for blocking work.
        x-editable-by: ["agent:*", "human:*"]

      # ---- timestamps -----------------------------------------------------
      # Left non-editable in the Viewer on purpose - timestamps should
      # come from the writer (`folio upsert` sends `updated_at`/`closed_at`
      # alongside the field that actually changed). Drop the
      # `x-editable-by` if you want to override stamps by hand in the UI.
      - name: created_at
        logicalType: timestamp
        required: true
        description: ISO-8601, when the task was first captured.

      - name: updated_at
        logicalType: timestamp
        required: true
        description: ISO-8601, last meaningful change.

      - name: closed_at
        logicalType: timestamp
        description: ISO-8601, when status transitioned to done/cancelled.

      # ---- derived --------------------------------------------------------
      - name: priority_score
        logicalType: integer
        description: |
          Numeric weight for sort, P0 - 100, P1 - 10, P2 - 1, P3 - 0.
          Deterministic - re-runs only when priority changes.
        x-derived: true
        x-inputs: [priority]

      - name: dep_count
        logicalType: integer
        description: Length of `depends`; quick sortable metric.
        x-derived: true
        x-inputs: [depends]

      - name: path_count
        logicalType: integer
        description: Length of `paths`; sortable proxy for task size.
        x-derived: true
        x-inputs: [paths]

      - name: verification_count
        logicalType: integer
        description: |
          Length of `verification`; tells stand-up which closed tasks
          are under-gated (`status=done` AND `verification_count=0`
          is the red flag).
        x-derived: true
        x-inputs: [verification]

      - name: is_blocked
        logicalType: boolean
        description: |
          True when any id in `depends` belongs to a row whose
          `status != 'done'`. SQL kind - runs a DuckDB query against
          the whole `records` view, so the value updates whenever a
          dependency closes.
        x-derived: true
        x-inputs: [depends]
